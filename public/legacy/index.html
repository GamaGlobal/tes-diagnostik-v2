<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Simulasi Tes IST</title>
<style>
  :root{
    --bg:#F3F0E6;
    --ink:#20242B;
    --ink-soft:#565B63;
    --panel:#FFFFFF;
    --line:#DCD6C7;
    --accent:#0E5C63;
    --accent-dark:#0A4247;
    --warn:#9A3B2E;
    --good:#2F6D3A;
    --badge-bg:#EFE9D8;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html{
    overscroll-behavior-y:contain;
  }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:40px;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif; margin:0 0 8px;}
  .no-select, .no-select *{
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .no-select input{
    -webkit-user-select:text;
    user-select:text;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .top-bar{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    padding:10px 16px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;
  }
  .dots{display:flex;gap:5px;flex-wrap:wrap;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .dot.done{background:var(--good);}
  .dot.current{background:var(--accent);transform:scale(1.3);}
  .timer{
    font-family:'SFMono-Regular',Menlo,monospace;
    font-variant-numeric:tabular-nums;
    font-size:1.15rem;font-weight:700;
    padding:4px 10px;border-radius:6px;
    background:var(--panel);border:1px solid var(--line);
  }
  .timer.low{color:var(--warn);border-color:var(--warn);}
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px;
    margin-bottom:16px;
  }
  .badge{
    width:74px;height:74px;border-radius:50%;
    border:2px dashed var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;font-weight:700;font-size:1.4rem;
    color:var(--accent-dark);margin:0 auto 14px;
    background:var(--badge-bg);
  }
  .center{text-align:center;}
  .btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;border:none;
    padding:13px 22px;
    border-radius:8px;
    font-size:1rem;font-weight:600;
    cursor:pointer;
    text-align:center;
  }
  .btn:active{background:var(--accent-dark);}
  .btn.secondary{
    background:transparent;color:var(--accent-dark);
    border:1px solid var(--accent);
  }
  .btn.block{display:block;width:100%;}
  .muted{color:var(--ink-soft);font-size:0.92rem;line-height:1.5;}
  .q-item{border-bottom:1px solid var(--line);padding:16px 0;}
  .q-item:last-child{border-bottom:none;}
  .q-num{font-weight:700;color:var(--accent-dark);margin-bottom:8px;}
  .opt-list{display:grid;gap:8px;margin-top:8px;}
  .opt{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:8px;
    padding:10px 12px;
    text-align:left;
    font-size:0.97rem;
    cursor:pointer;
    display:flex;gap:10px;align-items:center;
  }
  .opt .let{
    width:22px;height:22px;border-radius:50%;
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;font-weight:700;flex-shrink:0;
  }
  .opt.selected{border-color:var(--accent);background:#EAF3F2;}
  .opt.selected .let{background:var(--accent);color:#fff;border-color:var(--accent);}
  .shape-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0;}
  .shape-row .qm{font-size:1.6rem;font-weight:700;color:var(--ink-soft);}
  .fig-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .fig-opts .opt{flex-direction:column;padding:12px 4px;}
  .cube-net{
    display:grid;
    grid-template-columns:repeat(4,56px);
    grid-template-rows:repeat(3,56px);
    gap:4px;justify-content:center;margin:14px 0;
  }
  .cube-cell{
    border:1px solid var(--line);border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;background:#FAF8F2;
  }
  .cube-cell.target{border:2px solid var(--accent);background:#EAF3F2;}
  .cube-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;}
  .cube-opts .opt{flex-direction:column;font-size:1.6rem;padding:12px 4px;}
  .mem-table{width:100%;border-collapse:collapse;margin:14px 0;}
  .mem-table td{padding:8px 10px;border-bottom:1px solid var(--line);font-size:0.95rem;}
  .mem-table td:first-child{color:var(--ink-soft);width:45%;}
  .progress-line{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px;}
  .progress-fill{height:100%;background:var(--accent);}
  .overlay{
    position:fixed;inset:0;background:rgba(32,36,43,0.92);
    color:#fff;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;z-index:50;text-align:center;padding:20px;
  }
  .result-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:0.95rem;}
  .result-row:last-child{border-bottom:none;}
  .iq-number{font-family:Georgia,serif;font-size:4rem;font-weight:700;color:var(--accent-dark);line-height:1;}
  .tag{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--badge-bg);color:var(--accent-dark);font-weight:700;font-size:0.9rem;}
  .disclaimer{font-size:0.82rem;color:var(--ink-soft);border-top:1px dashed var(--line);padding-top:12px;margin-top:16px;line-height:1.5;}
  .violation-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(154,59,46,0.97);
    color:#fff;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;text-align:center;padding:24px;
    animation:flashWarn 0.5s ease-in-out 3;
  }
  @keyframes flashWarn{0%,100%{background:rgba(154,59,46,0.97);}50%{background:rgba(220,38,38,0.97);}}
  .lock-screen{
    position:fixed;inset:0;z-index:110;
    background:#20242B;color:#fff;
    display:flex;align-items:center;justify-content:center;
    padding:20px;overflow-y:auto;
  }
  .lock-card{max-width:420px;width:100%;text-align:center;}
  .lock-card input{
    width:100%;padding:12px;border-radius:8px;border:1px solid #565B63;
    background:#2B303A;color:#fff;font-size:1.2rem;text-align:center;
    letter-spacing:4px;margin:14px 0 8px;
  }
  .violation-log{text-align:left;font-size:0.85rem;color:#B9C0C7;max-height:160px;overflow-y:auto;background:#2B303A;border-radius:8px;padding:10px;margin-top:14px;}
  .confirm-overlay{
    position:fixed;inset:0;z-index:105;
    background:rgba(32,36,43,0.75);
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .confirm-card{
    background:var(--panel);border-radius:12px;padding:24px 20px;
    max-width:380px;width:100%;text-align:center;
  }
  .confirm-card .btn-row{display:flex;gap:10px;margin-top:16px;}
  .confirm-card .btn-row .btn{flex:1;}
</style>
</head>

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmt(s){
  const m=Math.floor(s/60), sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}
function shuffledMC(q,options,answerIdx){
  const correct=options[answerIdx];
  const opts=shuffle(options);
  return {kind:'text',q,options:opts,answer:opts.indexOf(correct)};
}

/* ============ GENERATORS: NUMERIC SERIES (ZR) ============ */
function uniqueDistractors(correct,count,spread){
  const set=new Set([correct]);
  const result=[];
  let attempts=0;
  while(result.length<count && attempts<80){
    attempts++;
    const delta=Math.floor(Math.random()*spread*2+1)-spread;
    if(delta===0) continue;
    const val=correct+delta;
    if(val<=0 || set.has(val)) continue;
    set.add(val); result.push(val);
  }
  let filler=1;
  while(result.length<count){
    const val=correct+filler*3+1;
    if(!set.has(val)){set.add(val); result.push(val);}
    filler++;
  }
  return result;
}
function generateZR(i,level){
  const type=i%5;
  let full=[];
  if(level==='sma'){
    if(type===0){
      let a=2+(i%4), d=3+(i%3);
      full=[a];
      for(let k=1;k<6;k++){ full.push(full[k-1]+d); d+=2; }
    } else if(type===1){
      let v=2+(i%3);
      full=[v];
      for(let k=1;k<6;k++){ v=(k%2===1)?v*2:v+5; full.push(v); }
    } else if(type===2){
      let v=1+(i%2);
      full=[v];
      for(let k=1;k<6;k++){ v*=3; full.push(v); }
    } else if(type===3){
      const a=3+(i%4), b=2+(i%3);
      let v=1+(i%3);
      full=[v];
      for(let k=1;k<6;k++){ v+=(k%2===1?a:b); full.push(v); }
    } else {
      const a=1+(i%3), b=2+(i%2);
      full=[a,b];
      for(let k=2;k<6;k++){ full.push(full[k-1]+2*full[k-2]); }
    }
  } else {
    if(type===0){
      const start=2+i, step=3+(i%5);
      let v=start;
      for(let k=0;k<6;k++){full.push(v); v+=step;}
    } else if(type===1){
      const start=1+(i%3), ratio=2+(i%2);
      let v=start;
      for(let k=0;k<6;k++){full.push(v); v*=ratio;}
    } else if(type===2){
      const off=i%4;
      for(let k=1;k<=6;k++){full.push((k+off)*(k+off));}
    } else if(type===3){
      const a=2+(i%3);
      full=[a];
      for(let k=1;k<6;k++){
        full.push(k%2===1 ? full[k-1]*2 : full[k-1]-1);
      }
    } else {
      const a=1+(i%4), b=2+(i%3);
      full=[a,b];
      for(let k=2;k<6;k++){full.push(full[k-1]+full[k-2]);}
    }
  }
  const seq=full.slice(0,5);
  const answer=full[5];
  const spread=Math.max(2,Math.round(Math.abs(answer)*0.15)+1);
  const distractors=uniqueDistractors(answer,3,spread);
  const opts=shuffle([answer,...distractors]);
  const answerIdx=opts.indexOf(answer);
  return {kind:'series',seq,options:opts,answer:answerIdx};
}

/* ============ GENERATORS: FIGURAL PATTERN (FA) ============ */
const FA_COLORS=['#2563eb','#dc2626','#16a34a','#d97706','#7c3aed'];
function polygonPoints(sides,cx,cy,r,rotDeg){
  rotDeg=rotDeg||0;
  const pts=[];
  for(let i=0;i<sides;i++){
    const ang=(Math.PI*2*i/sides)-Math.PI/2+(rotDeg*Math.PI/180);
    pts.push((cx+r*Math.cos(ang)).toFixed(1)+','+(cy+r*Math.sin(ang)).toFixed(1));
  }
  return pts.join(' ');
}
function shapeSVG(sides,color,size,rotDeg){
  size=size||58;
  const cx=size/2, cy=size/2, r=size/2-5;
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+
    '<polygon points="'+polygonPoints(sides,cx,cy,r,rotDeg)+'" fill="'+color+'" stroke="#20242B" stroke-width="2"/></svg>';
}
function generateFA(i,level){
  const startSides=3+(i%3);
  const colorIdx=i%FA_COLORS.length;
  const color=FA_COLORS[colorIdx];
  if(level==='sma'){
    const rotStep=13+(i%3)*9;
    const seq=[0,1,2].map(k=>({sides:startSides+k,color,rot:k*rotStep}));
    const correct={sides:startSides+3,color,rot:3*rotStep};
    const wrongRot={sides:startSides+3,color,rot:2*rotStep};
    const wrongSides={sides:startSides+2,color,rot:3*rotStep};
    const wrongColor={sides:startSides+3,color:FA_COLORS[(colorIdx+1)%FA_COLORS.length],rot:3*rotStep};
    const opts=shuffle([correct,wrongRot,wrongSides,wrongColor]);
    const answer=opts.findIndex(o=>o.sides===correct.sides && o.rot===correct.rot && o.color===correct.color);
    return {kind:'figural',seq,options:opts,answer};
  }
  const seq=[startSides,startSides+1,startSides+2].map(s=>({sides:s,color}));
  const correct={sides:startSides+3,color};
  const wrongProgress={sides:startSides+2,color};
  const wrongPlus={sides:startSides+4,color};
  const wrongColor={sides:startSides+3,color:FA_COLORS[(colorIdx+1)%FA_COLORS.length]};
  const opts=shuffle([correct,wrongProgress,wrongPlus,wrongColor]);
  const answer=opts.findIndex(o=>o.sides===correct.sides && o.color===correct.color);
  return {kind:'figural',seq,options:opts,answer};
}

/* ============ GENERATORS: CUBE NET (WU) ============ */
const CUBE_SYMBOLS=['★','●','▲','■','◆','✦','☀','♣','♥','☂','✈','☘'];
const CUBE_POS=['Top','Left','Front','Right','Back','Bottom'];
const CUBE_OPPOSITE={Top:'Bottom',Bottom:'Top',Left:'Right',Right:'Left',Front:'Back',Back:'Front'};
const CUBE_BAND=['Left','Front','Right','Back'];
function generateWU(){
  const pool=shuffle([...CUBE_SYMBOLS]).slice(0,6);
  const net={};
  CUBE_POS.forEach((p,idx)=>net[p]=pool[idx]);
  const target=CUBE_POS[Math.floor(Math.random()*CUBE_POS.length)];
  const oppositeFace=CUBE_OPPOSITE[target];
  const correct=net[oppositeFace];
  const others=CUBE_POS.filter(p=>p!==target && p!==oppositeFace).map(p=>net[p]);
  const distractors=shuffle(others).slice(0,3);
  const opts=shuffle([correct,...distractors]);
  const answer=opts.indexOf(correct);
  const rot=Math.floor(Math.random()*4);
  let band=CUBE_BAND.slice(rot).concat(CUBE_BAND.slice(0,rot));
  if(Math.random()<0.5) band=band.slice().reverse();
  const swapVertical=Math.random()<0.5;
  const layout={
    top: swapVertical?'Bottom':'Top',
    bottom: swapVertical?'Top':'Bottom',
    col1: band[0], col2: band[1], col3: band[2], col4: band[3]
  };
  return {kind:'cube',net,target,options:opts,answer,layout};
}

     example:{q:'Contoh: Jika 2 kg gula harganya Rp30.000, berapa harga 5 kg?',options:['Rp60.000','Rp70.000','Rp75.000','Rp80.000'],answer:2},
     duration:D.RA,
     questions:raSrc.map(([q,options,answer])=>shuffledMC(q,options,answer))},
    {id:'ZR',title:'Deret Angka',code:'ZR',module:'IST',scoring:'correct',
     desc:'Menguji penalaran logis-numerik.',
     instruction:'Temukan pola pada deret angka, lalu pilih angka selanjutnya.',
     example:{q:'Contoh: 2, 4, 8, 16, 32, ?',options:['48','64','56','60'],answer:1},

/* Level dikunci lewat parameter URL (?level=smp / ?level=sma), dibagikan panitia
   per kelompok kelas, agar siswa tidak perlu (dan tidak bisa) salah pilih jenjang. */
const _urlLevelParam=new URLSearchParams(window.location.search).get('level');
const lockedLevel=(_urlLevelParam==='smp'||_urlLevelParam==='sma') ? _urlLevelParam : null;
if(lockedLevel) selectedLevel=lockedLevel;

let cheatCount=0;
let cheatLog=[];
let antiCheatArmed=false;
let violationCooldown=false;

/* ============ PENYIMPANAN SESI (agar tahan refresh tidak sengaja) ============ */
function saveSession(){
  if(phase==='welcome' || phase==='final' || phase==='resumePrompt') return;
  try{
    const snapshot={
      sections, curIdx, phase, secondsLeft,
      userAnswers, sectionScores,
      studentName, studentSchool, studentClass, studentNIS,
      currentLevel, selectedModules,
      cheatCount, cheatLog, phaseBeforeLock, isLocked,
      savedAt:Date.now()
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(snapshot));
  }catch(e){ /* localStorage penuh/tidak tersedia — abaikan diam-diam */ }
}
function loadSavedSession(){
  try{
    const raw=localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const data=JSON.parse(raw);
    if(!data || !data.savedAt || (Date.now()-data.savedAt)>SESSION_MAX_AGE_MS) { localStorage.removeItem(SESSION_KEY); return null; }
    if(!data.sections || !data.sections.length) return null;
    return data;
  }catch(e){ return null; }
}
function clearSession(){
  try{ localStorage.removeItem(SESSION_KEY); }catch(e){}
}

function resumeSession(data){
  sections=data.sections;
  curIdx=data.curIdx;
  userAnswers=data.userAnswers;
  sectionScores=data.sectionScores;
  studentName=data.studentName;
  studentSchool=data.studentSchool;
  studentClass=data.studentClass;
  studentNIS=data.studentNIS||'';
  currentLevel=data.currentLevel;
  selectedModules=data.selectedModules;
  cheatCount=data.cheatCount||0;
  cheatLog=data.cheatLog||[];
  phaseBeforeLock=data.phaseBeforeLock;
  isLocked=!!data.isLocked;

  const elapsedSec=Math.floor((Date.now()-data.savedAt)/1000);
  secondsLeft=Math.max(0, data.secondsLeft-elapsedSec);

  if(data.phase==='locked'){
    phase='locked';
    render();
    startHeartbeat(); // tetap lanjutkan heartbeat walau lagi terkunci, supaya panitia tetap lihat statusnya
  } else if(data.phase==='memorize' || data.phase==='test'){
    phase=data.phase;
    armAntiCheat();
    requestFS();
    if(secondsLeft<=0){
      /* waktu sudah habis selagi halaman tertutup/refresh */
      render();
      if(data.phase==='memorize'){ startTest(); } else { finishSection(true); }
    } else {
      render();
      if(data.phase==='memorize'){ startMemorizeTimer(); } else { startTestTimer(); }
    }
    startHeartbeat(); // BUG SEBELUMNYA: resumeSession() lupa restart heartbeat setelah reload/resume
  } else {
    /* intro */
    phase='intro';
    render();
  }
}

function totalMinutes(){
  let s=0;
  sections.forEach(sec=>{ s+= (sec.memorizeDuration||0)+sec.duration; });
  return Math.round(s/60);
}
function totalQuestions(){
  return sections.reduce((a,s)=>a+s.questions.length,0);
}
function previewInfo(level,modules){
  const s=buildSections(level,modules);
  const q=s.reduce((a,x)=>a+x.questions.length,0);
  const m=Math.round(s.reduce((a,x)=>a+(x.memorizeDuration||0)+x.duration,0)/60);
  return {q,m,count:s.length};
}

function progressDots(){
  let html='<div class="dots">';
  sections.forEach((s,i)=>{
    let cls='dot';
    if(i<curIdx) cls+=' done';
    if(i===curIdx) cls+=' current';
    html+='<div class="'+cls+'" title="'+s.code+'"></div>';
  });
  html+='</div>';
  return html;
}

/* ============ ANTI-CURANG ============ */
let armGraceUntil=0;
function armAntiCheat(){
  antiCheatArmed=true;
  armGraceUntil=Date.now()+2500; /* abaikan pelanggaran sesaat setelah mulai/lanjut (transisi layar, fullscreen, dsb) */
  document.body.classList.add('no-select');
}
function disarmAntiCheat(){
  antiCheatArmed=false;
  document.body.classList.remove('no-select');
}
function isActiveTestPhase(){
  return antiCheatArmed && Date.now()>=armGraceUntil && (phase==='test' || phase==='memorize');
}
function playAlertSound(){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const now=ctx.currentTime;
    [0,0.35,0.7].forEach(offset=>{
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.type='square';
      osc.frequency.setValueAtTime(1200,now+offset);
      gain.gain.setValueAtTime(0.0001,now+offset);
      gain.gain.exponentialRampToValueAtTime(1,now+offset+0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001,now+offset+0.28);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now+offset); osc.stop(now+offset+0.3);
    });
  }catch(e){ /* Web Audio tidak tersedia */ }
  if(navigator.vibrate){ navigator.vibrate([250,100,250,100,500]); }
}
function requestFS(){
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.msRequestFullscreen;
  if(req){ req.call(el).catch(()=>{}); }
}
function isFullscreen(){
  return !!(document.fullscreenElement||document.webkitFullscreenElement);
}
function registerViolation(reason){
  if(!isActiveTestPhase()) return;
  if(isLocked) return;
  if(violationCooldown) return;
  violationCooldown=true;
  setTimeout(()=>{violationCooldown=false;},1500);

  cheatCount++;
  cheatLog.push(reason+' — '+new Date().toLocaleTimeString('id-ID'));
  playAlertSound();
  saveSession();

  if(cheatHandle) clearTimeout(cheatHandle);
  const overlay=document.createElement('div');
  overlay.className='violation-overlay';
  overlay.id='violationOverlay';
  overlay.innerHTML='<div style="font-size:3rem;">⚠️</div>'+
    '<h2 style="color:#fff;margin:0;">Pelanggaran Terdeteksi!</h2>'+
    '<p style="font-size:1.05rem;">'+reason+'</p>'+
    '<p style="font-size:1.3rem;font-weight:700;">Pelanggaran ke-'+cheatCount+' dari '+MAX_VIOLATIONS+'</p>'+
    (cheatCount<MAX_VIOLATIONS ? '<p>Tes akan otomatis terkunci jika pelanggaran mencapai '+MAX_VIOLATIONS+' kali.</p>' : '');
  document.body.appendChild(overlay);
  cheatHandle=setTimeout(()=>{
    overlay.remove();
    if(cheatCount>=MAX_VIOLATIONS){ lockTest(); }
  },2800);
}
let cheatHandle=null;
let isLocked=false;

function scoreCurrentSectionIfInProgress(){
  const s=sections[curIdx];
  if(!s || !userAnswers[s.id]) return;
  const arr=userAnswers[s.id];
  if(s.scoring==='category'){
    const byCategory={};
    s.questions.forEach((q,idx)=>{
      const val=(arr[idx]!==null && arr[idx]!==undefined) ? arr[idx]+1 : 0;
      if(!byCategory[q.category]) byCategory[q.category]={sum:0,count:0};
      byCategory[q.category].sum+=val; byCategory[q.category].count+=1;
    });
    sectionScores[s.id]={byCategory};
  } else if(s.scoring==='aptitude'){
    const byCategory={};
    let correct=0;
    s.questions.forEach((q,idx)=>{
      const isCorrect=arr[idx]===q.answer;
      if(isCorrect) correct++;
      if(!byCategory[q.category]) byCategory[q.category]={correct:0,count:0};
      byCategory[q.category].count+=1;
      if(isCorrect) byCategory[q.category].correct+=1;
    });
    sectionScores[s.id]={byCategory,correct};
  } else {
    let correct=0;
    s.questions.forEach((q,idx)=>{ if(arr[idx]===q.answer) correct++; });
    sectionScores[s.id]=correct;
  }
}

function lockTest(){
  isLocked=true;

function attemptUnlock(){

  if(val===SUPERVISOR_PIN){

      startTestTimer();

let hiddenTimer=null;
const HIDDEN_GRACE_MS=4000; /* layar tersembunyi sebentar (mis. layar mati/notifikasi) tidak dihitung; baru pelanggaran jika lebih lama dari ini */
document.addEventListener('visibilitychange',()=>{

/* Tebak jenjang dari isian kelas (angka 7-9 => SMP, 10-12 => SMA).
   Dipakai hanya untuk cek silang peringatan, bukan untuk mengubah pilihan siswa. */
function inferLevelFromClass(kelasStr){
  const m=kelasStr.match(/\d{1,2}/);
  if(!m) return null;
  const n=parseInt(m[0],10);
  if(n>=7 && n<=9) return 'smp';
  if(n>=10 && n<=12) return 'sma';
  return null;
}

function beginTest(){
  if(!(selectedModules.IST||selectedModules.RIASEC||selectedModules.GAYA||selectedModules.BAKAT)) return;
  const nameVal=document.getElementById('inpName').value.trim();
  if(!nameVal){ alert('Mohon isi nama terlebih dahulu.'); return; }
  const nisVal=document.getElementById('inpNIS').value.trim();
  if(!/^\d{5}$/.test(nisVal)){ alert('Mohon isi 5 digit terakhir NIS (angka saja).'); return; }
  const classVal=document.getElementById('inpClass').value.trim();

  // Cek silang: hanya relevan kalau level TIDAK dikunci lewat URL dan modul IST dipilih.
  if(!lockedLevel && selectedModules.IST){
    const inferred=inferLevelFromClass(classVal);
    if(inferred && inferred!==selectedLevel){
      const inferredLbl=inferred==='smp'?'SMP':'SMA';
      const chosenLbl=selectedLevel==='smp'?'SMP':'SMA';
      showConfirmDialog(
        'Kelas yang Anda isi ("'+classVal+'") biasanya jenjang <strong>'+inferredLbl+'</strong>, tapi level soal yang dipilih <strong>'+chosenLbl+'</strong>. Lanjutkan dengan level '+chosenLbl+'?',
        function(){ doBeginTest(nameVal,classVal,nisVal); },
        'Ya, Lanjutkan '+chosenLbl,
        'Batal, Ubah Level'
      );
      return;
    }
  }
  doBeginTest(nameVal,classVal,nisVal);
}

function doBeginTest(nameVal,classVal,nisVal){
  clearSession();
  studentName=nameVal;
  studentSchool=document.getElementById('inpSchool').value.trim();
  studentClass=classVal;
  studentNIS=nisVal;
  currentLevel=selectedLevel;
  sections=buildSections(currentLevel,selectedModules);
  curIdx=0;
  cheatCount=0;
  cheatLog=[];
  isLocked=false;
  finalSaved=false;
  armAntiCheat();
  requestFS();
  phase='intro';

let heartbeatHandle=null;
// Diperlonggar dari 40 detik -> 120 detik supaya hemat kuota "total runtime trigger per hari"
// dari Google (90 menit/hari untuk akun konsumer). Dengan 700 peserta, tiap heartbeat yang
// dikirim itu ikut memakan kuota harian ini, jadi interval yang lebih longgar = jauh lebih hemat.
// Konsekuensinya: status di monitor-live.html jadi update tiap ~2 menit, bukan tiap 40 detik --
// masih cukup untuk memantau progres peserta, cuma kurang "real-time" dibanding sebelumnya.
const HEARTBEAT_INTERVAL_MS = 120000;
function startHeartbeat(){
  if(heartbeatHandle) clearInterval(heartbeatHandle);
  sendHeartbeat();
  heartbeatHandle=setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);
}
function stopHeartbeat(){
  if(heartbeatHandle){ clearInterval(heartbeatHandle); heartbeatHandle=null; }
}
function sendHeartbeat(){
  if(!GAS_URL || GAS_URL.indexOf('PASTE_URL')===0) return;
  const s=sections[curIdx];
  const answeredCount = s ? (userAnswers[s.id]||[]).filter(a=>a!==null && a!==undefined).length : 0;
  const beat={
    type:'heartbeat',
    nama:studentName, sekolah:studentSchool, kelas:studentClass, nis:studentNIS,
    tahap: s ? (s.code+' - '+s.title) : phase,
    tahapKe: curIdx+1, totalTahap: sections.length,
    soalTerjawab: answeredCount, totalSoal: s ? s.questions.length : 0,
    cheatCount, timestamp:new Date().toISOString()
  };
  fetch(GAS_URL,{method:'POST',body:JSON.stringify(beat)}).catch(err=>{
    console.warn('Gagal mengirim heartbeat:', err);
  });
}

}

function renderMemorize(){
  const s=sections[curIdx];
  app.innerHTML=
  '<div class="top-bar">'+progressDots()+'<span style="display:flex;gap:8px;align-items:center;">'+
    (cheatCount>0?'<span class="timer low" style="font-size:0.85rem;">⚠ '+cheatCount+'/'+MAX_VIOLATIONS+'</span>':'')+
    '<span class="timer" id="timerDisplay">'+fmt(secondsLeft)+'</span></span></div>'+
  '<div class="wrap">'+
    '<div class="card">'+
      '<h2>Hafalkan Pasangan Berikut</h2>'+
      '<p class="muted">Anda akan diuji setelah waktu ini habis, tanpa melihat daftar lagi.</p>'+
      '<table class="mem-table">'+
        s.pairs.map(([cat,item])=>'<tr><td>'+cat+'</td><td><strong>'+item+'</strong></td></tr>').join('')+
      '</table>'+
    '</div>'+
  '</div>';
}

function startTest(){
  const s=sections[curIdx];
  phase='test';
  armGraceUntil=Date.now()+1500;
  secondsLeft=s.duration;
  userAnswers[s.id]=new Array(s.questions.length).fill(null);
  render();
  saveSession();
  startTestTimer();
}

function startTestTimer(){
  timerHandle=setInterval(()=>{
    secondsLeft--;
    const el=document.getElementById('timerDisplay');
    if(el){
      el.textContent=fmt(secondsLeft);
      if(secondsLeft<=30) el.classList.add('low');
    }
    saveSession();
    if(secondsLeft<=0){
      clearInterval(timerHandle);
      finishSection(true);
    }
  },1000);
}

function selCls(sec,qIdx,oi){
  const arr=userAnswers[sec.id];
  return (arr && arr[qIdx]===oi) ? ' selected' : '';
}

function renderQOptions(sec,q,qIdx){
  if(q.kind==='text'){
    return '<div class="opt-list">'+
      q.options.map((o,oi)=>'<div class="opt'+selCls(sec,qIdx,oi)+'" onclick="selectAnswer('+qIdx+','+oi+')" id="opt-'+qIdx+'-'+oi+'"><span class="let">'+String.fromCharCode(65+oi)+'</span><span>'+o+'</span></div>').join('')+
    '</div>';
  }
  if(q.kind==='series'){
    return '<div class="shape-row"><strong style="font-size:1.15rem;">'+q.seq.join(', ')+', <span style="color:var(--accent-dark)">?</span></strong></div>'+
      '<div class="opt-list" style="grid-template-columns:repeat(4,1fr);display:grid;">'+
      q.options.map((o,oi)=>'<div class="opt'+selCls(sec,qIdx,oi)+'" style="justify-content:center;" onclick="selectAnswer('+qIdx+','+oi+')" id="opt-'+qIdx+'-'+oi+'">'+o+'</div>').join('')+
      '</div>';
  }
  if(q.kind==='figural'){
    return '<div class="shape-row">'+
      q.seq.map(sh=>shapeSVG(sh.sides,sh.color,undefined,sh.rot)).join('')+
      '<span class="qm">?</span></div>'+
      '<div class="fig-opts">'+
      q.options.map((o,oi)=>'<div class="opt'+selCls(sec,qIdx,oi)+'" onclick="selectAnswer('+qIdx+','+oi+')" id="opt-'+qIdx+'-'+oi+'">'+shapeSVG(o.sides,o.color,undefined,o.rot)+'</div>').join('')+
      '</div>';
  }
  if(q.kind==='cube'){
    const net=q.net;
    const layout=q.layout;
    const pos=(p,col,row)=>'<div style="grid-column:'+col+';grid-row:'+row+';" class="cube-cell'+(p===q.target?' target':'')+'">'+net[p]+'</div>';
    return '<p class="muted">Sisi bertanda kotak biru = <strong>'+q.target+'</strong>. Simbol apa yang berhadapan dengannya setelah dilipat?</p>'+
      '<div class="cube-net">'+
      pos(layout.top,2,1)+
      pos(layout.col1,1,2)+
      pos(layout.col2,2,2)+
      pos(layout.col3,3,2)+
      pos(layout.col4,4,2)+
      pos(layout.bottom,2,3)+
      '</div>'+
      '<div class="cube-opts">'+
      q.options.map((o,oi)=>'<div class="opt'+selCls(sec,qIdx,oi)+'" onclick="selectAnswer('+qIdx+','+oi+')" id="opt-'+qIdx+'-'+oi+'">'+o+'</div>').join('')+
      '</div>';
  }
  if(q.kind==='likert'){
    const labels=sec.scaleLabels;
    return '<div class="opt-list">'+
      labels.map((o,oi)=>'<div class="opt'+selCls(sec,qIdx,oi)+'" onclick="selectAnswer('+qIdx+','+oi+')" id="opt-'+qIdx+'-'+oi+'"><span class="let">'+(oi+1)+'</span><span>'+o+'</span></div>').join('')+
    '</div>';
  }
  return '';
}

function renderTest(){
  const s=sections[curIdx];
  let qHtml='';
  s.questions.forEach((q,qi)=>{
    qHtml+='<div class="q-item"><div class="q-num">Soal '+(qi+1)+'</div>'+
      (q.kind==='text'||q.kind==='likert' ? '<div>'+q.q+'</div>' : '')+
      renderQOptions(s,q,qi)+
    '</div>';
  });
  const answeredCount=(userAnswers[s.id]||[]).filter(a=>a!==null && a!==undefined).length;
  app.innerHTML=
  '<div class="top-bar">'+progressDots()+'<span style="display:flex;gap:8px;align-items:center;">'+
    (cheatCount>0?'<span class="timer low" style="font-size:0.85rem;">⚠ '+cheatCount+'/'+MAX_VIOLATIONS+'</span>':'')+
    '<span class="timer'+(secondsLeft<=30?' low':'')+'" id="timerDisplay">'+fmt(secondsLeft)+'</span></span></div>'+
  '<div class="wrap">'+
    '<div class="card" style="padding:14px 16px;">'+
      '<strong>'+s.code+' — '+s.title+'</strong>'+
      '<div class="progress-line"><div class="progress-fill" id="answeredBar" style="width:'+(answeredCount/s.questions.length*100)+'%"></div></div>'+
      '<span class="muted" id="answeredCount">'+answeredCount+' / '+s.questions.length+' terjawab</span>'+
    '</div>'+
    '<div class="card">'+qHtml+'</div>'+
    '<button class="btn block secondary" onclick="confirmFinish()">Selesaikan Bagian Ini Lebih Awal</button>'+
  '</div>';
}

function selectAnswer(qIdx,optIdx){
  const s=sections[curIdx];
  userAnswers[s.id][qIdx]=optIdx;
  const optCount=s.questions[qIdx].kind==='likert' ? s.scaleLabels.length : s.questions[qIdx].options.length;
  for(let oi=0;oi<optCount;oi++){
    const el=document.getElementById('opt-'+qIdx+'-'+oi);
    if(el) el.classList.toggle('selected', oi===optIdx);
  }
  const answeredCount=userAnswers[s.id].filter(a=>a!==null).length;
  const bar=document.getElementById('answeredBar');
  const label=document.getElementById('answeredCount');
  if(bar) bar.style.width=(answeredCount/s.questions.length*100)+'%';
  if(label) label.textContent=answeredCount+' / '+s.questions.length+' terjawab';
  saveSession();
}

function confirmFinish(){
  const s=sections[curIdx];
  const msg = s.scoring==='category' ?
    'Selesaikan bagian ini sekarang? Pernyataan yang belum dijawab tidak akan dihitung.' :
    'Selesaikan subtes ini sekarang? Jawaban yang belum diisi akan dianggap salah.';
  const overlay=document.createElement('div');
  overlay.className='confirm-overlay';
  overlay.innerHTML=
    '<div class="confirm-card">'+
      '<p style="margin:0;">'+msg+'</p>'+
      '<div class="btn-row">'+
        '<button class="btn secondary" id="confirmNo">Batal</button>'+
        '<button class="btn" id="confirmYes">Ya, Selesaikan</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('confirmNo').onclick=()=>{ overlay.remove(); };
  document.getElementById('confirmYes').onclick=()=>{ overlay.remove(); finishSection(false); };
}

function finishSection(auto){
  clearInterval(timerHandle);
  const s=sections[curIdx];
  const arr=userAnswers[s.id];
  if(s.scoring==='category'){
    const byCategory={};
    s.questions.forEach((q,idx)=>{
      const val=(arr[idx]!==null && arr[idx]!==undefined) ? arr[idx]+1 : 0;
      if(!byCategory[q.category]) byCategory[q.category]={sum:0,count:0};
      byCategory[q.category].sum+=val;
      byCategory[q.category].count+=1;
    });
    sectionScores[s.id]={byCategory};
    const answeredCount=arr.filter(a=>a!==null).length;
    showTransition(auto ? 'Waktu Habis' : 'Modul Selesai', s.title+' — '+answeredCount+' dari '+s.questions.length+' pernyataan dijawab');
  } else if(s.scoring==='aptitude'){
    const byCategory={};
    let correct=0;
    s.questions.forEach((q,idx)=>{
      const isCorrect=arr[idx]===q.answer;
      if(isCorrect) correct++;
      if(!byCategory[q.category]) byCategory[q.category]={correct:0,count:0};
      byCategory[q.category].count+=1;
      if(isCorrect) byCategory[q.category].correct+=1;
    });
    sectionScores[s.id]={byCategory,correct};
    const answeredCountApt=arr.filter(a=>a!==null && a!==undefined).length;
    showTransition(auto ? 'Waktu Habis' : 'Modul Selesai', s.title+' — '+answeredCountApt+' dari '+s.questions.length+' soal dikerjakan');
  } else {
    let correct=0;
    s.questions.forEach((q,idx)=>{ if(arr[idx]===q.answer) correct++; });
    sectionScores[s.id]=correct;
    const answeredCount=arr.filter(a=>a!==null && a!==undefined).length;
    showTransition(auto ? 'Waktu Habis' : 'Subtes Selesai', s.title+' — '+answeredCount+' dari '+s.questions.length+' soal dikerjakan');
  }
}

function showTransition(title,subtitle){
  const overlay=document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML='<h2 style="color:#fff;">'+title+'</h2><p>'+subtitle+'</p>';
  document.body.appendChild(overlay);
  setTimeout(()=>{
    overlay.remove();
    curIdx++;
    if(curIdx>=sections.length){ phase='final'; disarmAntiCheat(); } else { phase='intro'; saveSession(); }
    render();
  },1600);
}

/* ============ FINAL RESULTS ============ */
const DOMAIN_MAP={SE:'Verbal',WA:'Verbal',AN:'Verbal',GE:'Verbal',RA:'Numerik',ZR:'Numerik',FA:'Figural',WU:'Figural',ME:'Memori'};

function classify(iq){
  if(iq>=130) return 'Sangat Superior';
  if(iq>=120) return 'Superior';
  if(iq>=110) return 'Di Atas Rata-rata';
  if(iq>=90) return 'Rata-rata';
  if(iq>=80) return 'Di Bawah Rata-rata';
  if(iq>=70) return 'Batas Lemah (Borderline)';
  return 'Perlu Asesmen Lanjutan';
}

function computeResults(){
  stopHeartbeat();
  const istSections=sections.filter(s=>s.module==='IST');
  const riasecSection=sections.find(s=>s.id==='RIASEC');
  const gayaSection=sections.find(s=>s.id==='GAYA');
  const bakatSection=sections.find(s=>s.id==='BAKAT');

  lastResults={nama:studentName,sekolah:studentSchool,kelas:studentClass,nis:studentNIS,cheatCount,cheatLog:cheatLog.join(' | '),timestamp:new Date().toISOString(),bankVersion:ITEM_BANK_VERSION};

  if(GAS_URL && GAS_URL.indexOf('PASTE_URL')!==0){
    fetch(GAS_URL,{method:'POST',body:JSON.stringify({
      type:'heartbeat', nama:studentName, sekolah:studentSchool, kelas:studentClass, nis:studentNIS,
      tahap:'Selesai', tahapKe:sections.length, totalTahap:sections.length,
      soalTerjawab:0, totalSoal:0, cheatCount, selesai:true, timestamp:new Date().toISOString()
    })}).catch(()=>{});
  }

  if(istSections.length){
    let totalCorrect=0, totalMax=0;
    const domainStats={};
    istSections.forEach(s=>{
      const c=sectionScores[s.id]||0, m=s.questions.length;
      totalCorrect+=c; totalMax+=m;
      const d=DOMAIN_MAP[s.id];
      if(!domainStats[d]) domainStats[d]={c:0,m:0};
      domainStats[d].c+=c; domainStats[d].m+=m;
    });
    const pct=totalCorrect/totalMax*100;
    let iq=Math.round(pct+35);
    iq=Math.max(55,Math.min(145,iq));
    lastResults.level=currentLevel==='sma'?'SMA':'SMP';
    lastResults.iqScores=Object.fromEntries(istSections.map(s=>[s.id, sectionScores[s.id]||0]));
    lastResults.iqTotalCorrect=totalCorrect;
    lastResults.iqTotalMax=totalMax;
    lastResults.iqPercentage=Math.round(pct);
    lastResults.iq=iq;
    lastResults.iqClassification=classify(iq);
    lastResults.iqDomain=Object.fromEntries(Object.keys(domainStats).map(d=>[d, Math.round(domainStats[d].c/domainStats[d].m*100)]));
  }

  if(riasecSection){
    const byCat=(sectionScores.RIASEC&&sectionScores.RIASEC.byCategory)||{};
    const rows=Object.keys(RIASEC_LABELS).map(k=>{
      const st=byCat[k]||{sum:0,count:1};
      return {key:k,pct:Math.round(st.sum/(st.count*4)*100)};
    }).sort((a,b)=>b.pct-a.pct);
    lastResults.riasecScores=Object.fromEntries(rows.map(r=>[r.key,r.pct]));
    lastResults.riasecTopCode=rows.slice(0,3).map(r=>r.key).join('');
  }

  if(gayaSection){
    const byCat=(sectionScores.GAYA&&sectionScores.GAYA.byCategory)||{};
    const rows=Object.keys(GAYA_LABELS).map(k=>{
      const st=byCat[k]||{sum:0,count:1};
      return {key:k,pct:Math.round(st.sum/(st.count*4)*100)};
    }).sort((a,b)=>b.pct-a.pct);
    lastResults.gayaScores=Object.fromEntries(rows.map(r=>[r.key,r.pct]));
    lastResults.gayaDominant=rows[0].key;
  }

  if(bakatSection){
    const byCat=(sectionScores.BAKAT&&sectionScores.BAKAT.byCategory)||{};
    const rows=Object.keys(BAKAT_LABELS).map(k=>{
      const st=byCat[k]||{correct:0,count:1};
      return {key:k,pct:Math.round(st.correct/st.count*100)};
    }).sort((a,b)=>b.pct-a.pct);
    lastResults.bakatScores=Object.fromEntries(rows.map(r=>[r.key,r.pct]));
    lastResults.bakatTop=rows[0].key;
    lastResults.bakatRekomendasi=(currentLevel==='sma'?BAKAT_DESC_SMA:BAKAT_DESC_SMP)[rows[0].key];
  }
}

let finalSaved=false;

function renderFinal(){
  computeResults();
  lastResults.status='Selesai Normal';
  if(!finalSaved){
    finalSaved=true;
    // cadangkan dulu segera (tidak ikut ditunda), baru pengiriman ke server-nya yang di-jitter
    try{ localStorage.setItem(PENDING_KEY, JSON.stringify(lastResults)); }catch(e){}
    const jitterMs=Math.floor(Math.random()*SUBMIT_JITTER_MAX_MS);
    setTimeout(saveToSheet, jitterMs);
  }
  clearSession();

  app.innerHTML=
  '<div class="wrap">'+
    '<div class="card center" style="margin-top:40px;padding:32px 20px;">'+
      '<div class="badge">✓</div>'+
      '<h1>Tes Selesai</h1>'+
      '<p class="muted">Terima kasih, '+studentName+'. Jawaban Anda telah tercatat.</p>'+
      '<p class="muted" style="margin-top:6px;">Hasil tes akan disampaikan oleh panitia/pengawas.</p>'+
    '</div>'+
    '<p class="disclaimer">Catatan: Asesmen ini disusun oleh LBB Gama Global dengan mengacu pada prinsip-prinsip tes IST, RIASEC, dan gaya belajar VAK. Hasil yang tertera merupakan estimasi hasil olahan internal untuk tujuan pemetaan potensi dan minat, bukan skor psikometri resmi bersertifikat.</p>'+
    '<button class="btn block secondary" style="margin-top:10px;" onclick="location.reload()">Selesai</button>'+
  '</div>';
}

let lastResults=null;
const PENDING_KEY='pendingResultSubmission_v1';

function saveToSheet(){
  if(!GAS_URL || GAS_URL.indexOf('PASTE_URL')===0){
    console.warn('GAS_URL belum dikonfigurasi — hasil tidak dikirim ke Google Sheets.');
    return;
  }
  try{ localStorage.setItem(PENDING_KEY, JSON.stringify(lastResults)); }catch(e){}
  sendResultWithRetry_(lastResults, 3);
}

function sendResultWithRetry_(payload, attemptsLeft){
  fetch(GAS_URL,{method:'POST',body:JSON.stringify(payload)})
    .then(()=>{
      console.log('Hasil berhasil dikirim ke Google Sheets.');
      try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
    })
    .catch(err=>{
      console.warn('Gagal mengirim hasil (percobaan tersisa: '+attemptsLeft+'):', err);
      if(attemptsLeft>1){
        setTimeout(()=>sendResultWithRetry_(payload, attemptsLeft-1), 4000);
      } else {
        // server mungkin sedang sangat sibuk — jangan menyerah, coba lagi tiap 25 detik di background
        // selama halaman ini masih terbuka, sambil tetap simpan cadangan di localStorage.
        console.warn('Masuk mode retry background, akan dicoba lagi tiap 25 detik...');
        setTimeout(()=>sendResultWithRetry_(payload, 1), 25000);
      }
    });
}

// kalau siswa sempat menutup/refresh halaman "Selesai" sebelum hasil berhasil terkirim,
// begitu index.html dibuka lagi di HP yang sama, coba kirim ulang hasil yang tertunda.
(function resendPendingIfAny(){
  try{
    const pending=localStorage.getItem(PENDING_KEY);
    if(pending){
      console.log('Ditemukan hasil tertunda dari sesi sebelumnya, mencoba kirim ulang...');
      sendResultWithRetry_(JSON.parse(pending), 3);
    }
  }catch(e){}
})();

const savedSession=loadSavedSession();
if(savedSession){
  pendingResume=savedSession;
  phase='resumePrompt';
}
render();
</script>
