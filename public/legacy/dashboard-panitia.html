<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Dashboard Panitia — Hasil Tes Diagnostik</title>
<style>
  :root{
    --bg:#F3F0E6; --ink:#20242B; --ink-soft:#565B63; --panel:#FFFFFF;
    --line:#DCD6C7; --accent:#0E5C63; --accent-dark:#0A4247;
    --warn:#9A3B2E; --good:#2F6D3A; --badge-bg:#EFE9D8;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:40px;}
  h1,h2,h3{font-family:Georgia,'Iowan Old Style',serif;margin:0 0 8px;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 16px 60px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;}
  .badge{width:74px;height:74px;border-radius:50%;border:2px dashed var(--accent);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:1.4rem;color:var(--accent-dark);margin:0 auto 14px;background:var(--badge-bg);}
  .center{text-align:center;}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:0.95rem;font-weight:600;cursor:pointer;}
  .btn:active{background:var(--accent-dark);}
  .btn.block{display:block;width:100%;}
  .btn.small{padding:6px 12px;font-size:0.82rem;}
  .btn.secondary{background:transparent;color:var(--accent-dark);border:1px solid var(--accent);}
  .muted{color:var(--ink-soft);font-size:0.92rem;line-height:1.5;}
  input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-size:1rem;margin-bottom:10px;}
  .err{color:var(--warn);font-size:0.88rem;min-height:18px;margin:2px 0 8px;text-align:center;}
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stat-box{background:var(--badge-bg);border-radius:8px;padding:12px;text-align:center;}
  .stat-box .num{font-family:Georgia,serif;font-size:1.6rem;font-weight:700;color:var(--accent-dark);}
  .stat-box .lbl{font-size:0.78rem;color:var(--ink-soft);}
  table{width:100%;border-collapse:collapse;font-size:0.85rem;}
  th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
  th{color:var(--ink-soft);font-weight:600;position:sticky;top:0;background:var(--panel);}
  .table-wrap{overflow-x:auto;max-width:100%;}
  .flag{color:var(--warn);font-weight:700;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .toolbar input{flex:1;min-width:160px;margin-bottom:0;}
  .loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:30px 0;color:var(--ink-soft);}
  .row-click{cursor:pointer;}
  .row-click:hover{background:#FAF8F2;}
  .modal-overlay{position:fixed;inset:0;background:rgba(32,36,43,0.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal-card{background:var(--panel);border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ KONFIGURASI ============ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxWx1FS-0htyoWmfPAT8adeoOQpxhRjscdcLIE8qNNZOPsTcuZAAtwGzw8ytlUVjxRB/exec';

const RIASEC_LABELS={R:'Realistic',I:'Investigative',A:'Artistic',S:'Social',E:'Enterprising',C:'Conventional'};
const GAYA_LABELS={V:'Visual',A:'Auditori',K:'Kinestetik'};
const BAKAT_LABELS={MIPA:'MIPA',IPS:'IPS',BHS:'Bahasa',INF:'Informatika',VOK:'Vokasi'};
/* Harus sama dengan ITEM_BANK_VERSION di index.html. Dipakai untuk menandai hasil yang
   berasal dari sebelum audit psikometri (data lama tanpa field ini) agar tidak
   dibandingkan langsung dengan hasil dari bank soal yang sudah direvisi. */
const CURRENT_BANK_VERSION='2026-08-audit-v2';
function bankVersionOf(r){ return r['Versi Bank Soal']||r.bankVersion||r['Bank Soal']||''; }
function bankBadge(r){
  const v=bankVersionOf(r);
  if(!v) return '<span class="flag" title="Data tanpa penanda versi bank soal — kemungkinan diambil sebelum revisi item Agustus 2026">⚠ Pra-revisi</span>';
  if(v!==CURRENT_BANK_VERSION) return '<span class="flag" title="Versi bank soal berbeda dari versi saat ini ('+CURRENT_BANK_VERSION+')">'+v+'</span>';
  return v;
}

const app=document.getElementById('app');
let allHasil=[];
let allPelanggaran=[];
let dashPin='';

function isDash(v){ return v===undefined || v===null || v==='' || v==='-'; }

function renderLogin(errMsg){
  app.innerHTML=
  '<div class="wrap">'+
    '<div class="card center" style="margin-top:60px;">'+
      '<div class="badge">🔑</div>'+
      '<h1>Dashboard Panitia</h1>'+
      '<p class="muted">Masukkan PIN khusus panitia untuk melihat rekap hasil tes seluruh siswa.</p>'+
      '<input id="inpPin" type="password" inputmode="numeric" placeholder="PIN Dashboard" style="text-align:center;letter-spacing:4px;">'+
      '<p class="err">'+(errMsg||'')+'</p>'+
      '<button class="btn block" onclick="loginDash()">Masuk</button>'+
    '</div>'+
  '</div>';
}

function renderLoading(){
  app.innerHTML='<div class="wrap"><div class="loading">Memuat data…</div></div>';
}

function loginDash(){
  const pin=document.getElementById('inpPin').value.trim();
  if(!pin){ renderLogin('Mohon isi PIN.'); return; }
  renderLoading();
  fetch(GAS_URL+'?action=all&pin='+encodeURIComponent(pin)+'&_ts='+Date.now(), {cache:'no-store'})
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok){ renderLogin(res.error||'PIN salah.'); return; }
      dashPin=pin;
      allHasil=res.hasil||[];
      allPelanggaran=res.pelanggaran||[];
      renderDashboard('');
    })
    .catch(()=>{ renderLogin('Gagal terhubung ke server. Coba lagi.'); });
}

function refreshData(){
  renderLoading();
  fetch(GAS_URL+'?action=all&pin='+encodeURIComponent(dashPin)+'&_ts='+Date.now(), {cache:'no-store'})
    .then(r=>r.json())
    .then(res=>{
      if(!res.ok){ renderLogin(res.error||'Sesi berakhir, masuk kembali.'); return; }
      allHasil=res.hasil||[];
      allPelanggaran=res.pelanggaran||[];
      renderDashboard(document.getElementById('searchBox')?document.getElementById('searchBox').value:'');
    })
    .catch(()=>{ renderLogin('Gagal terhubung ke server.'); });
}

function computeStats(){
  const withIQ=allHasil.filter(r=>!isDash(r['Estimasi IQ']));
  const avgIQ=withIQ.length ? Math.round(withIQ.reduce((a,r)=>a+Number(r['Estimasi IQ']),0)/withIQ.length) : '-';
  const flagged=allHasil.filter(r=>Number(r['Jumlah Pelanggaran'])>0).length;
  const preRevisi=allHasil.filter(r=>!bankVersionOf(r)).length;
  return {total:allHasil.length, avgIQ, flagged, violations:allPelanggaran.length, preRevisi};
}

function renderDashboard(filter){
  const stats=computeStats();
  filter=(filter||'').toLowerCase();
  const filtered=allHasil.filter(r=>
    !filter || (r.Nama||'').toLowerCase().includes(filter) || (r.Sekolah||'').toLowerCase().includes(filter) || (r.Kelas||'').toLowerCase().includes(filter) || String(r.NIS||'').includes(filter)
  ).sort((a,b)=> new Date(b.Timestamp) - new Date(a.Timestamp));

  let rows=filtered.map((r,i)=>{
    const idx=allHasil.indexOf(r);
    return '<tr class="row-click" onclick="showDetail('+idx+')">'+
      '<td>'+(r.Nama||'-')+'</td>'+
      '<td>'+(r.Sekolah||'-')+'</td>'+
      '<td>'+(r.Kelas||'-')+'</td>'+
      '<td>'+(r.NIS||'-')+'</td>'+
      '<td>'+(r['Estimasi IQ']||'-')+'</td>'+
      '<td>'+(r['Kode RIASEC (3 Besar)']||'-')+'</td>'+
      '<td>'+(r['Gaya Belajar Dominan']||'-')+'</td>'+
      '<td>'+(r['Bakat Dominan']||'-')+'</td>'+
      '<td>'+(Number(r['Jumlah Pelanggaran'])>0 ? '<span class="flag">⚠ '+r['Jumlah Pelanggaran']+'</span>' : '0')+'</td>'+
      '<td>'+bankBadge(r)+'</td>'+
    '</tr>';
  }).join('');

  app.innerHTML=
  '<div class="wrap">'+
    '<div class="card center">'+
      '<h1>Dashboard Panitia</h1>'+
      '<p class="muted">Rekap hasil Tes Diagnostik — LBB Gama Global</p>'+
    '</div>'+
    '<div class="card">'+
      '<div class="stat-grid">'+
        '<div class="stat-box"><div class="num">'+stats.total+'</div><div class="lbl">Total Peserta</div></div>'+
        '<div class="stat-box"><div class="num">'+stats.avgIQ+'</div><div class="lbl">Rata-rata IQ</div></div>'+
        '<div class="stat-box"><div class="num">'+stats.flagged+'</div><div class="lbl">Peserta Terflag</div></div>'+
        '<div class="stat-box"><div class="num">'+stats.violations+'</div><div class="lbl">Total Catatan Pelanggaran</div></div>'+
      '</div>'+
      (stats.preRevisi>0 ? '<p class="muted" style="margin-top:10px;">⚠ <strong>'+stats.preRevisi+'</strong> hasil tidak memiliki penanda versi bank soal (kemungkinan diambil sebelum revisi item Agustus 2026) — jangan bandingkan langsung skornya dengan hasil dari bank soal versi saat ini ('+CURRENT_BANK_VERSION+').</p>' : '')+
    '</div>'+
    '<div class="card">'+
      '<div class="toolbar">'+
        '<input id="searchBox" type="text" placeholder="Cari nama / sekolah / kelas / NIS…" value="'+filter+'" oninput="renderDashboard(this.value)">'+
        '<button class="btn small secondary" onclick="refreshData()">↻ Muat Ulang</button>'+
        '<button class="btn small secondary" onclick="exportCSV()">⬇ Export CSV</button>'+
      '</div>'+
      '<div class="table-wrap"><table>'+
        '<thead><tr><th>Nama</th><th>Sekolah</th><th>Kelas</th><th>NIS</th><th>IQ</th><th>RIASEC</th><th>Gaya</th><th>Bakat</th><th>Pelanggaran</th><th>Versi Soal</th></tr></thead>'+
        '<tbody>'+(rows||'<tr><td colspan="10" class="muted" style="text-align:center;">Tidak ada data.</td></tr>')+'</tbody>'+
      '</table></div>'+
    '</div>'+
    '<p class="disclaimer muted">Catatan: Asesmen ini disusun oleh LBB Gama Global dengan mengacu pada prinsip-prinsip tes IST, RIASEC, dan gaya belajar VAK. Hasil yang tertera merupakan estimasi hasil olahan internal untuk tujuan pemetaan potensi dan minat, bukan skor psikometri resmi bersertifikat.</p>'+
  '</div>';
}

function showDetail(idx){
  const d=allHasil[idx];
  if(!d) return;
  const riasec={R:d['R (%)'],I:d['I (%)'],A:d['A (%)'],S:d['S (%)'],E:d['E (%)'],C:d['C (%)']};
  const gaya={V:d['Visual (%)'],A:d['Auditori (%)'],K:d['Kinestetik (%)']};
  const bakat={MIPA:d['MIPA (%)'],IPS:d['IPS (%)'],BHS:d['Bahasa (%)'],INF:d['Informatika (%)'],VOK:d['Vokasi (%)']};
  const domain={Verbal:d['Verbal (%)'],Numerik:d['Numerik (%)'],Figural:d['Figural (%)'],Memori:d['Memori (%)']};
  const rowsHtml=(obj,labels)=>Object.keys(obj).filter(k=>!isDash(obj[k])).sort((a,b)=>obj[b]-obj[a]).map(k=>'<div class="muted">'+(labels[k]||k)+': <strong>'+obj[k]+'%</strong></div>').join('');

  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.onclick=(e)=>{ if(e.target===overlay) overlay.remove(); };
  overlay.innerHTML='<div class="modal-card">'+
    '<h2>'+(d.Nama||'-')+'</h2>'+
    '<p class="muted">'+(d.Sekolah||'-')+' • Kelas '+(d.Kelas||'-')+' • NIS '+(d.NIS||'-')+'</p>'+
    '<p class="muted">Waktu: '+(d.Timestamp||'-')+'</p>'+
    '<p class="muted">Versi bank soal: '+bankBadge(d)+'</p>'+
    (!isDash(d['Estimasi IQ']) ? '<h3 style="font-size:0.95rem;margin-top:14px;">IQ: '+d['Estimasi IQ']+' ('+d['Klasifikasi']+')</h3>'+rowsHtml(domain,{}) : '')+
    (!isDash(d['Kode RIASEC (3 Besar)']) ? '<h3 style="font-size:0.95rem;margin-top:14px;">RIASEC: '+d['Kode RIASEC (3 Besar)']+'</h3>'+rowsHtml(riasec,RIASEC_LABELS) : '')+
    (!isDash(d['Gaya Belajar Dominan']) ? '<h3 style="font-size:0.95rem;margin-top:14px;">Gaya Belajar: '+(GAYA_LABELS[d['Gaya Belajar Dominan']]||d['Gaya Belajar Dominan'])+'</h3>'+rowsHtml(gaya,GAYA_LABELS) : '')+
    (!isDash(d['Bakat Dominan']) ? '<h3 style="font-size:0.95rem;margin-top:14px;">Bakat: '+(BAKAT_LABELS[d['Bakat Dominan']]||d['Bakat Dominan'])+'</h3><p class="muted">'+(d['Rekomendasi Mapel Pilihan']||'')+'</p>'+rowsHtml(bakat,BAKAT_LABELS) : '')+
    (Number(d['Jumlah Pelanggaran'])>0 ? '<h3 style="font-size:0.95rem;margin-top:14px;" class="flag">⚠ '+d['Jumlah Pelanggaran']+' Pelanggaran</h3><p class="muted" style="font-size:0.8rem;">'+(d['Detail Pelanggaran']||'')+'</p>' : '')+
    '<button class="btn block" style="margin-top:16px;" onclick="this.closest(\'.modal-overlay\').remove()">Tutup</button>'+
    '<button class="btn block" style="margin-top:8px;background:transparent;color:var(--warn);border:1px solid var(--warn);" onclick="hapusHasil('+idx+')">🗑 Hapus Hasil Ini</button>'+
  '</div>';
  document.body.appendChild(overlay);
}

function hapusHasil(idx){
  const d=allHasil[idx];
  if(!d) return;
  if(!confirm('Hapus hasil tes atas nama "'+(d.Nama||'-')+'" (NIS '+(d.NIS||'-')+', '+(d.Timestamp||'-')+')? Tindakan ini tidak bisa dibatalkan.')) return;
  fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'deleteHasil',pin:dashPin,nis:d.NIS,timestamp:d.Timestamp})})
    .then(r=>r.json())
    .then(res=>{
      if(!res || !res.ok){ alert('Gagal menghapus: '+((res&&res.error)||'server tidak merespons sesuai harapan. Pastikan Code.gs sudah mendukung action "deleteHasil".')); return; }
      document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
      refreshData();
    })
    .catch(()=>{ alert('Gagal terhubung ke server saat menghapus.'); });
}

function exportCSV(){
  const headers=['Nama','Sekolah','Kelas','NIS','Estimasi IQ','Klasifikasi','Kode RIASEC (3 Besar)','Gaya Belajar Dominan','Bakat Dominan','Jumlah Pelanggaran','Versi Bank Soal','Timestamp'];
  const lines=[headers.join(',')];
  allHasil.forEach(r=>{
    lines.push(headers.map(h=>{
      const val = h==='Versi Bank Soal' ? (bankVersionOf(r)||'(pra-revisi)') : (r[h]||'');
      return '"'+String(val).replace(/"/g,'""')+'"';
    }).join(','));
  });
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='rekap_hasil_tes_diagnostik.csv';
  a.click();
  URL.revokeObjectURL(url);
}

renderLogin();
</script>
</body>
</html>
